<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogTech - Crear Cuenta</title>
    <!-- Agrega aquí tus estilos CSS si los tienes en un archivo externo -->
    <style>
        /* Puedes mantener tus estilos CSS existentes aquí */
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .register-card {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #333;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            background-color: #555;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #666;
        }
        a {
            color: #64b5f6;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <h2>🐶 DogTech</h2>
        <h3>Crear Cuenta</h3>

        <form id="registroForm">
            <div class="form-group">
                <input type="text" id="nombre" placeholder="Nombre completo" required>
            </div>
            <div class="form-group">
                <input type="email" id="email" placeholder="Correo electrónico" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Contraseña" required>
            </div>

            <button type="submit" id="btnSubmit">Registrarse</button>
        </form>

        <p style="margin-top: 20px; font-size: 14px;">
            ¿Ya tienes cuenta? <a href="/login.html">Inicia sesión aquí</a>
        </p>
    </div>

    <script>
        const form = document.getElementById('registroForm');
        const btnSubmit = document.getElementById('btnSubmit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Deshabilitar botón durante el envío
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Registrando...';

            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // AQUÍ ESTÁ LA CORRECCIÓN CLAVE: Usar '/api/registro' con barra inicial
                const response = await fetch('/api/registro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ nombre, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.mensaje || '¡Usuario registrado con éxito!');
                    window.location.href = '/login.html'; // Redirigir al login
                } else {
                    alert(data.mensaje || `Error al registrar usuario (Código: ${response.status})`);
                }
            } catch (error) {
                console.error('Error de red o servidor:', error);
                alert('No se pudo conectar con el servidor. Revisa tu conexión.');
            } finally {
                // Restaurar botón
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Registrarse';
            }
        });
    </script>
</body>
</html>
