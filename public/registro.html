<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogTech - Crear Cuenta</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        .card h2 { margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group input {
            width: 92%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #383838;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: #505050; }
        a { color: #3b82f6; text-decoration: none; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🐶 DogTech</h2>
        <h3>Crear Cuenta</h3>

        <form id="registroForm">
            <div class="input-group">
                <input type="text" id="nombre" placeholder="Nombre completo" required>
            </div>
            <div class="input-group">
                <input type="email" id="email" placeholder="Correo electrónico" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Contraseña" required>
            </div>
            <button type="submit" id="btnSubmit">Registrarse</button>
        </form>

        <p style="margin-top: 15px;">
            ¿Ya tienes cuenta? <a href="/login.html">Inicia sesión aquí</a>
        </p>
    </div>

    <script>
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.innerText = 'Registrando...';
            btnSubmit.disabled = true;

            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/registro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ nombre, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('¡Registro exitoso!');
                    // window.location.href = '/login.html';
                } else {
                    alert(`Error (${response.status}): ${data.mensaje || 'Error al registrar'}`);
                }
            } catch (error) {
                console.error('Error de red:', error);
                alert('No se pudo conectar con el servidor.');
            } finally {
                btnSubmit.innerText = 'Registrarse';
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>
</html>
