<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DogTech - Iniciar Sesión</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 380px; text-align: center; }
    h2 { color: #0056b3; margin-bottom: 20px; }
    input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:hover { background-color: #1e7e34; }
    p { margin-top: 15px; font-size: 14px; }
    a { color: #0056b3; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🐶 DogTech</h2>
    <h3>Iniciar Sesión</h3>
    <form id="form-login">
      <input type="email" id="email" placeholder="Correo electrónico" required>
      <input type="password" id="password" placeholder="Contraseña" required>
      <button type="submit">Ingresar</button>
    </form>
    <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
  </div>

  <script>
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const respuesta = await fetch('http://localhost:3000/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      
      const data = await respuesta.json();
      if (respuesta.ok) {
        // Guardamos el nombre del usuario para mostrarlo en el menú principal
        localStorage.setItem('usuarioNombre', data.nombre || 'Usuario');
        window.location.href = 'dashboard.html'; // Redirige al panel de la veterinaria
      } else {
        alert(data.mensaje || 'Credenciales incorrectas');
      }
    });
  </script>
</body>
</html>
