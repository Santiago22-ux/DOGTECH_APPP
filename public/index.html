<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogTech - Autenticación</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f8; }
        .container { display: flex; gap: 40px; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 320px; }
        form { display: flex; flex-direction: column; gap: 12px; }
        input, button { padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #0066cc; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #004b99; }
        .msg { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>DogTech - Sistema de Gestión Veterinaria</h1>
    <div class="container">
        <!-- Registro -->
        <div class="card">
            <h2>Crear Cuenta</h2>
            <form id="form-registro">
                <input type="text" id="reg-nombre" placeholder="Nombre completo" required>
                <input type="email" id="reg-email" placeholder="Correo electrónico" required>
                <input type="password" id="reg-password" placeholder="Contraseña" required>
                <button type="submit">Registrarse</button>
            </form>
            <div id="msg-registro" class="msg"></div>
        </div>

        <!-- Login -->
        <div class="card">
            <h2>Iniciar Sesión</h2>
            <form id="form-login">
                <input type="email" id="login-email" placeholder="Correo electrónico" required>
                <input type="password" id="login-password" placeholder="Contraseña" required>
                <button type="submit">Ingresar</button>
            </form>
            <div id="msg-login" class="msg"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
